<!-- ✅ MODAL PARA COMPLETAR HÁBITO -->
<script defer th:src="@{/js/habit.js}"></script>

<div th:fragment="completeHabitModal" id="completeHabitModal" class="modal hidden">
  <div class="modal-content">
    <h2>Complete habit</h2>
    <p id="modalHabitTitle" class="habit-modal-title">Habit's name</p>
    
    <div class="form-group">
      <label for="habitNote">Note (How was it? :>)</label>
      <textarea id="habitNote" 
                placeholder="Añade una nota sobre cómo completaste este hábito..."
                maxlength="500"></textarea>
    </div>

    <div class="modal-buttons">
      <button id="cancelCompleteBtn" class="btn-cancel">Cancel</button>
      <button id="saveCompleteBtn" class="btn-primary">Save ✨</button>
    </div>
  </div>
</div>
