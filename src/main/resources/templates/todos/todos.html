<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  
<head>
  <meta charset="UTF-8">
  <title>Padma | To-dos</title>
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/todo.css}">
    <link rel="stylesheet" th:href="@{/css/todos.css}">

  <script th:src="@{/js/todo.js}"></script>
  <script th:src="@{/js/list.js}"></script>
  <link rel="stylesheet" th:href="@{/css/syles.css}">

</head>

<body th:attr="data-user-id=${userId}">
  <div class="dashboard">
    <!-- Sidebar principal -->
    <aside class="sidebar">
      <div class="logo"><h2>PADMA</h2></div>
      <nav class="menu">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/todos}" class="active">To-dos</a>
        <a th:href="@{/habits}">Habits</a>
        <a th:href="@{/profile}">Profile</a>
      </nav>
      <div class="logout"><a th:href="@{/logout}">Log out</a></div>
    </aside>

    <!-- Sidebar secundaria: Listas -->
    <!-- Sidebar secundaria: Listas -->
<aside class="list-sidebar">
  
  <!-- ✅ FILTROS (Today, Week, All) -->
  <ul class="list-group">
    <li><a th:href="@{/todos/today}">Today</a></li>
    <li><a th:href="@{/todos/week}">Next 7 days</a></li>
    <li><a th:href="@{/todos/all}">All tasks</a></li>
  </ul>

  <!-- ✅ SEPARADOR VISUAL -->
  <div class="sidebar-divider"></div>

  <!-- ✅ ENCABEZADO DE LISTAS CON BOTÓN DE EDICIÓN -->
  <div class="sidebar-header">
    <h3>Listas</h3>
  </div>

  

  <!-- ✅ LISTA DE LISTAS DEL USUARIO -->
  <!-- ✅ LISTA DE LISTAS DEL USUARIO CON BOTONES INDIVIDUALES -->
<ul class="list-group">
  <li th:each="list : ${lists}" class="list-item-wrapper">
    <a th:href="@{'/todos/list/' + ${list.listTodoId}}" th:text="${list.name}"></a>
    
    <!-- Botón ⋮ para cada lista -->
    <button class="list-menu-btn" th:data-list-id="${list.listTodoId}">⋮</button>
    
    <!-- Menú desplegable para cada lista -->
    <div class="list-item-menu hidden" th:id="'listmenu-' + ${list.listTodoId}">
      <button class="menu-item edit-list-btn" th:data-list-id="${list.listTodoId}">✏️ Editar</button>
      <button class="menu-item delete-list-btn" th:data-list-id="${list.listTodoId}">🗑️ Eliminar</button>
    </div>
  </li>

  <li th:if="${#lists.isEmpty(lists)}">
    <p>No lists yet.</p>
  </li>
</ul>


  <!-- ✅ FORMULARIO CREAR NUEVA LISTA -->
  <form class="new-list-form" id="createListForm">
    <input type="text" id="listName" placeholder="Nueva lista" required maxlength="50">
    <button type="button" id="createListBtn">+</button>
  </form>

</aside>


    <!-- Contenido principal -->
    <main class="main-content">
      <header class="header">
        <h1>Today's tasks</h1>
        <p th:text="${currentDate}">Septiembre 28</p>
      </header>

      <!-- Fechas del mes -->
      <div class="calendar-strip">
        <div th:each="day : ${daysOfMonth}">
          <button class="day-btn" th:text="${day.label}" th:data-date="${day.date}"
                  th:classappend="${day.isToday} ? 'active' : ''"
                  th:onclick="'filterByDate(\\'' + ${day.date} + '\\')'"></button>
        </div>
      </div>

      <!-- AGREGAR TAREA -->
<div class="add-task-form">
  <div class="input-group">
    <input type="text" id="taskName" placeholder="Add new task" maxlength="100">
    
    <div class="date-picker-wrapper">
      <label for="taskDate">📅</label>
      <input type="date" id="taskDate" th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
    </div>

    <button id="toggleMoreBtn" class="more-btn">⋮</button>
  </div>

  <!-- Sección expandible de detalles -->
  <div id="moreDetails" class="more-details hidden">
    <textarea id="taskDesc" placeholder="Description (opcional)"></textarea>
    
    <select id="taskList">
      <option value="">-- Without list --</option>
      <option th:each="list : ${lists}" th:value="${list.listTodoId}" th:text="${list.name}"></option>
    </select>

    <select id="taskPriority" class="priority-select">
  <option value="Not Urgent but Important" data-color="#FFC107">Not Urgent but Important</option>
  <option value="Urgent and Important" data-color="#FF6B6B">Urgent and Important</option>
  <option value="Urgent but not Important" data-color="#FF9500">Urgent but not Important</option>
  <option value="Not Urgent and Not Important" data-color="#90EE90">Not Urgent and Not Important</option>
</select>

    <div class="form-buttons">
      <button id="cancelBtn" class="btn-cancel">Cancel</button>
      <button id="createBtn" class="btn-create">New task</button>
    </div>
  </div>
</div>


      <!-- Lista de tareas -->
<section class="todo-list">
  <h2 th:text="${selectedFilter}">To Do</h2>
  <ul>
    <li th:each="todo : ${todos}" class="todo-item-wrapper">
      <!-- Checkbox y contenido -->
      <label class="todo-item">
        <input type="checkbox"
       th:checked="${todo.completed}"
       th:attr="onchange=|toggleTodo(${todo.todoId}, this)|" />
        
        <div class="todo-content">
          <span class="todo-name" th:text="${todo.name}"></span>
          <span class="todo-date" th:text="${#temporals.format(todo.dueDate, 'MMM dd')}"></span>
        </div>
      </label>

      <!-- Botón menú FUERA del label -->
      <button class="todo-menu-btn" th:data-todo-id="${todo.todoId}">⋮</button>

      <!-- Menú desplegable FUERA del label -->
      <div class="todo-menu hidden" th:id="'menu-' + ${todo.todoId}">
        <button class="menu-item edit-btn" th:data-todo-id="${todo.todoId}">Edit</button>
        <button class="menu-item delete-btn" th:data-todo-id="${todo.todoId}">Delete</button>
      </div>
    </li>

    <li th:if="${#lists.isEmpty(todos)}" class="empty-state">
      <p>No tasks for today 🌱</p>
    </li>
  </ul>
</section>

<!-- MODAL EDITAR TAREA-->
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h2>Edit Task</h2>
    
    <div class="form-group">
      <label for="editTaskName">Name</label>
      <input type="text" id="editTaskName" maxlength="100">
    </div>

    <div class="form-group">
      <label for="editTaskDesc">Description</label>
      <textarea id="editTaskDesc"></textarea>
    </div>

    <div style="display: flex; gap: 15px;">
      <div class="form-group" style="flex: 1;">
        <label for="editTaskDate">Date</label>
        <input type="date" id="editTaskDate">
      </div>
      

      <div class="form-group" style="flex: 1;">
        <label for="editTaskPriority">Priority</label>
        <select id="taskPriority" class="priority-select">
  <option value="Not Urgent but Important" data-color="#FFC107">Not Urgent but Important</option>
  <option value="Urgent and Important" data-color="#FF6B6B">Urgent and Important</option>
  <option value="Urgent but not Important" data-color="#FF9500">Urgent but not Important</option>
  <option value="Not Urgent and Not Important" data-color="#90EE90">Not Urgent and Not Important</option>
</select>
      </div>


<div class="form-group"  style="flex: 1;">
  <label for="editTaskList">List</label>
  <select id="editTaskList">
    <option value="">Without list</option>
    <option th:each="list : ${lists}" 
            th:value="${list.listTodoId}" 
            th:text="${list.name}"></option>
  </select>
</div>

    <div class="modal-buttons">
      <button id="cancelEditBtn" class="btn-cancel">Cancel</button>
      <button id="saveEditBtn" class="btn-create">Save changes</button>
    </div>
  </div>
</div>
      
    </main>
  </div>
</body>
</html>
