<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Padma | Home</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <link rel="stylesheet" th:href="@{/css/todos.css}">
     <link rel="stylesheet" th:href="@{/css/habits.css}">



</head>

<body>
<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h2>PADMA</h2>
        </div>

        <nav class="menu">
            <a th:href="@{/home}" class="active" data-section="home">Home</a>
            <a th:href="@{/todos}" data-section="todos">To-dos</a>
            <a th:href="@{/habits}" data-section="habits">Habits</a>
        </nav>

        <div class="logout">
            <a th:href="@{/logout}">Log out</a>
        </div>
    </aside>

    <!-- Main content -->
    <main class="content">
        <header class="welcome">
            <p class ="saludo">Hi, <span th:text="${user != null ? user.name : 'Usuario'}">Usuario</span></p>
            <p>Today is a amazing day to progress with your goals</p>
        </header>

        <section id="main-section">
            <div id="home-section" class="section active">
                <p class = "summary">Today's Summary</p>

             <!-- Sección de Tareas -->
<!-- Sección de Tareas -->
<div class="tasks-summary">
  <p class="title">Today's tasks</p>
  
  <div th:if="${todos != null and todos.size() > 0}">
    <ul class="todo-list">
      <li th:each="todo : ${todos}" 
          class="todo-item-wrapper"
          th:classappend="${todo.completed} ? ' completed' : ''">
        
        <!-- Label con checkbox y contenido -->
        <label class="todo-item">
          <input type="checkbox"
                 class="todo-checkbox"
                 th:checked="${todo.completed}"
                 th:attr="onchange=|toggleTodo(${todo.todoId}, this)|" />
          
          <div class="todo-content">
            <span class="todo-name" th:text="${todo.name}"></span>
            <span class="priority-badge" 
                  th:classappend="${todo.priority == 'Urgent and Important' ? 'priority-urgent-important' : 
                                   todo.priority == 'Urgent but not Important' ? 'priority-urgent-notimportant' :
                                   todo.priority == 'Not Urgent but Important' ? 'priority-noturgent-important' :
                                   'priority-noturgent-notimportant'}"
                  th:text="${todo.priority}"></span>
          </div>
        </label>
      </li>
    </ul>
  </div>
  
  <div th:if="${todos == null or todos.size() == 0}" class="empty-state">
    <p>No tasks for today 🌿</p>
  </div>
</div>


<div class="habits-summary">
  <p class="title">Your habits</p>
  <ul class="habit-list">
    <li th:each="habit : ${habits}" class="habit-item-wrapper">
      <!-- Checkbox -->
      <input type="checkbox" 
             class="habit-checkbox"
             th:data-habit-id="${habit.habitId}"
             th:checked="${habit.completed}">
      
      <!-- Info del hábito (nombre + racha JUNTOS) -->
      <div class="habit-info">
        <span class="habit-title" th:text="${habit.title}">Título del hábito</span>
        
        <!-- Racha como badge (al lado, no abajo) -->
        <span class="habit-streak-badge">
          🔥 <span th:text="${habit.habitHistory != null ? habit.habitHistory.currentStreak : 0}">0</span>
        </span>
      </div>
    </li>
    
    <li th:if="${#lists.isEmpty(habits)}" class="empty-state">
      <p>No habits for today 🌸. Start today with a new one! 📝</p>
    </li>
  </ul>
</div>

            <div id="todos-section" class="section"></div>
            <div id="habits-section" class="section"></div>
            <div id="profile-section" class="section">
                <h2>Tu perfil</h2>
                <p th:text="${user != null ? user.email : 'correo@ejemplo.com'}"></p>
            </div>
        </section>
    </main>
</div>
<div th:replace="fragments/completeHabit :: completeHabitModal"></div>

    <script defer th:src="@{/js/home.js}"></script>
</body>


</html>
