<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Padma | Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script defer th:src="@{/js/home.js}"></script>
</head>

<body>
<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h2>PADMA</h2>
        </div>

        <nav class="menu">
            <a th:href="@{/home}" class="active" data-section="home">Home</a>
            <a th:href="@{/todos}" data-section="todos">To-dos</a>
            <a th:href="@{/habits}" data-section="habits">Hábitos</a>
            <a th:href="@{/profile}" data-section="profile">Perfil</a>
        </nav>

        <div class="logout">
            <a th:href="@{/logout}">Salir</a>
        </div>
    </aside>

    <!-- Main content -->
    <main class="content">
        <header class="welcome">
            <h1>Hola, <span th:text="${user != null ? user.name : 'Usuario'}">Usuario</span></h1>
            <p>¡Hoy es un gran día para avanzar en tus metas!</p>
        </header>

        <section id="main-section">
            <div id="home-section" class="section active">
                <h2>Resumen de hoy</h2>
                <p>Aquí verás tus tareas y hábitos destacados del día</p>
            </div>

            <div id="todos-section" class="section"></div>
            <div id="habits-section" class="section"></div>
            <div id="profile-section" class="section">
                <h2>Tu perfil</h2>
                <p th:text="${user != null ? user.email : 'correo@ejemplo.com'}"></p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
