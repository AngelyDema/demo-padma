<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Detail</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/habit_detail.css" />
</head>
<body>
  <div class="container">
    <!-- Sidebar principal -->
    <aside class="sidebar">
      <div class="menu-icons">
        <button class="icon user"></button>
        <button class="icon habits active"></button>
        <button class="icon home"></button>
        <button class="icon stats"></button>
      </div>
    </aside>

    <!-- Sub-sidebar -->
    <aside class="sub-sidebar">
      <nav class="sub-nav">
        <ul>
          <li class="active">Today</li>
          <li>All habits</li>
        </ul>
      </nav>

      <div class="areas">
        <h4>Areas</h4>
        <ul>
          <li>📁 Area1</li>
          <li>📁 Area2</li>
          <li>📁 Area3</li>
          <li>📁 Area4</li>
        </ul>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main">
      <div class="habit-header">
        <input type="text" placeholder="Practice guitar" />
      </div>

      <div class="streak-card">
        <div class="icon">🔥</div>
        <div class="streak-text">
          <p class="label">CURRENT STREAK</p>
          <p class="value">2 Days</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <p class="label">FINISHED</p>
          <p class="value">2 days</p>
        </div>
        <div class="stat-card">
          <p class="label">FAILED</p>
          <p class="value">0 days</p>
        </div>
        <div class="stat-card">
          <p class="label">TOTAL</p>
          <p class="value">2 times</p>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-bar">
          <div class="progress-fill">10%</div>
        </div>
      </div>

      <div class="calendar">
        <table>
          <thead>
            <tr>
              <th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>28</td><td>29</td><td class="today">30</td><td>1</td><td>2</td><td>3</td><td>4</td></tr>
            <tr><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td></tr>
            <tr><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td></tr>
            <tr><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td></tr>
            <tr><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td>1</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
