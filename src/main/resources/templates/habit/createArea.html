        <!-- ✅ MODAL PARA CREAR ÁREA -->
<div id="createAreaModal" class="modal hidden">
  <div class="modal-content">
    <h2>Crear Área</h2>
    
    <div class="form-group">
      <label for="modalAreaName">Nombre</label>
      <input type="text" id="modalAreaName" maxlength="50" required>
    </div>

    <div class="form-group">
      <label for="modalAreaDesc">Descripción</label>
      <textarea id="modalAreaDesc" maxlength="500" placeholder="Descripción (opcional)"></textarea>
    </div>

    <div class="modal-buttons">
      <button id="cancelAreaBtn" class="btn-cancel">Cancelar</button>
      <button id="saveAreaBtn" class="btn-primary">Guardar</button>
    </div>
  </div>
</div>
